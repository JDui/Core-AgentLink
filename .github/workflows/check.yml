name: C-AL contracts and examples
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Rust build and contracts
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked
      - name: Python SDK and real Rust interoperability
        shell: pwsh
        run: |
          $calExecutable = if ($IsWindows) { 'target/debug/cal.exe' } else { 'target/debug/cal' }
          $env:C_AL_CLI = (Resolve-Path $calExecutable).Path
          python -m unittest discover -s tests -v

