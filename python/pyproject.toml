[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-agentlink-sdk"
version = "0.1.0"
description = "Language-neutral C-AL v1 local client and log projection"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["cal_sdk*"]

